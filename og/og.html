<!doctype html>
<!-- Source for og.png (1200×630 share preview). Rendered once with a headless browser; not linked from the site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; font-family: Inter, sans-serif; color: #ecebf3;
    background:
      radial-gradient(520px 380px at 12% 8%, rgba(78, 92, 138, 0.55), transparent 70%),
      radial-gradient(560px 420px at 92% 82%, rgba(128, 58, 104, 0.42), transparent 70%),
      radial-gradient(420px 320px at 40% 110%, rgba(92, 78, 164, 0.32), transparent 70%),
      radial-gradient(120% 90% at 50% 40%, #121019, #060509 75%);
  }
  #stars { position: absolute; inset: 0; }
  .window {
    position: absolute; left: 80px; top: 70px; width: 1040px; height: 490px; border-radius: 22px;
    background: rgba(30, 28, 40, 0.28); border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 40px 80px -30px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
  }
  .bar { height: 54px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
  .lights { display: flex; gap: 10px; }
  .lights i { width: 15px; height: 15px; border-radius: 50%; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .bar span { flex: 1; text-align: center; margin-right: 65px; font-size: 18px; color: #a7a3b8; }
  .body { padding: 44px 64px; }
  .prompt { font: 400 20px/1 'JetBrains Mono', monospace; color: #9a96ab; }
  .prompt b { color: #a8a2ff; font-weight: 400; } .prompt em { color: #e8a2c8; font-style: normal; }
  h1 {
    margin-top: 22px; font-size: 92px; line-height: 1; font-weight: 800; letter-spacing: -0.045em;
    background: linear-gradient(180deg, #ecebf3 30%, #c3bdf3); -webkit-background-clip: text; color: transparent;
    padding-bottom: 0.14em; margin-bottom: -0.14em;
  }
  h1 i { display: inline-block; width: 8px; height: 76px; margin-left: 8px; vertical-align: -4px; background: #a8a2ff; border-radius: 2px; }
  .role { margin-top: 18px; font-size: 32px; font-weight: 600; }
  .sum { margin-top: 10px; font-size: 22px; color: #a7a3b8; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 34px; }
  .badges { display: flex; align-items: center; gap: 10px; }
  .badges img { width: 50px; height: 50px; object-fit: contain; }
  .badges .sep { width: 1px; height: 34px; margin: 0 8px; background: rgba(255, 255, 255, 0.2); }
  .url { font: 500 24px/1 'JetBrains Mono', monospace; color: #ecebf3; }
  .url span { color: #3ddc97; }
</style>
</head>
<body>
<canvas id="stars" width="1200" height="630"></canvas>
<div class="window">
  <div class="bar"><div class="lights"><i></i><i></i><i></i></div><span>davis@whydavis · zsh</span></div>
  <div class="body">
    <p class="prompt"><b>~</b> <em>❯</em> whoami</p>
    <h1>Davis Huaytán<i></i></h1>
    <p class="role">Software Development Engineer in Test</p>
    <p class="sum">7+ years of test automation · Serenity Screenplay · Playwright · Salesforce</p>
    <div class="foot">
      <div class="badges">
        <img src="../assets/badges/ctfl.png" alt=""><img src="../assets/badges/ctfl-at.png" alt="">
        <img src="../assets/badges/ctal-tae.png" alt=""><img src="../assets/badges/ct-ai.png" alt="">
        <span class="sep"></span>
        <img src="../assets/badges/sf-admin.png" alt=""><img src="../assets/badges/sf-associate.png" alt="">
        <img src="../assets/badges/sf-ai-associate.png" alt="">
      </div>
      <p class="url"><span>●</span> whydavis.me</p>
    </div>
  </div>
</div>
<script>
  // deterministic starfield so re-rendering gives the same image
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const c = document.getElementById("stars").getContext("2d");
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 1200, y = rnd() * 630, r = rnd() * 1.1 + 0.3;
    c.fillStyle = `rgba(255,255,255,${rnd() * 0.6 + 0.2})`;
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
</script>
</body>
</html>
